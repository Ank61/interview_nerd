<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Interview Nerd</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        max-width: 32rem;
        text-align: center;
      }
      a { color: #38bdf8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>The app shell is cached, and it will continue to load when your connection is unavailable.</p>
      <p>Please reconnect to refresh the latest content.</p>
    </div>
  </body>
</html>
